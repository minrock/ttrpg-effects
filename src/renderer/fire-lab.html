<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuego procedural | TTRPG Effects</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #181b1b; color: #dce2df; font: 13px system-ui, sans-serif; }
      header { min-height: 60px; padding: 10px 18px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #39423e; flex-wrap: wrap; }
      h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; }
      label { display: flex; gap: 8px; align-items: center; }
      select { background: #242b28; color: inherit; padding: 7px; border: 1px solid #505b55; border-radius: 4px; }
      input { accent-color: #d6ab61; }
      output { font-variant-numeric: tabular-nums; min-width: 96px; color: #a2bbae; }
      #viewport { min-width: 0; min-height: 0; overflow: hidden; }
      canvas { display: block; }
      @media (max-width: 760px) { header { min-height: 110px; gap: 10px; } h1 { width: 100%; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Fuego procedural</h1>
      <select aria-label="Escenario">
        <option value="mixed">Antorchas, hoguera y zonas</option>
        <option value="large">Incendio extenso</option>
        <option value="many">24 fuegos</option>
      </select>
      <label>Zoom <input id="zoom" aria-label="Zoom" type="range" min="0.2" max="2" step="0.05" value="1" /></label>
      <label><input id="visible" type="checkbox" checked /> Fuego</label>
      <output id="fps" aria-label="Rendimiento">-- fps</output>
    </header>
    <main id="viewport" aria-label="Prueba de fuego sobre mapa"></main>
    <script type="module" src="./src/fire-lab.ts"></script>
  </body>
</html>
