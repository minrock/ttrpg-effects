<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relampagos | TTRPG Effects</title>
    <style>
      * { box-sizing: border-box; letter-spacing: 0; }
      body { margin: 0; height: 100dvh; background: #181c1e; color: #edf2f4; font: 13px system-ui, sans-serif; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
      header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid #3b4346; }
      h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; }
      fieldset { display: flex; padding: 0; margin: 0; border: 0; gap: 3px; }
      button { width: 34px; height: 32px; display: grid; place-items: center; background: #272d30; color: #becacf; border: 1px solid #475156; border-radius: 4px; cursor: pointer; }
      button[aria-pressed="true"] { background: #d6af63; color: #181d20; border-color: #d6af63; }
      button:hover { border-color: #bfeef4; }
      button:focus-visible, input:focus-visible { outline: 2px solid #bfeef4; outline-offset: 3px; }
      label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
      input[type="range"] { width: 86px; accent-color: #bfeef4; }
      input[type="checkbox"] { accent-color: #d6af63; }
      main { overflow: hidden; min-width: 0; min-height: 0; position: relative; }
      canvas { display: block; touch-action: none; }
      footer { display: flex; justify-content: space-between; gap: 12px; padding: 8px 20px; color: #aebabe; font-size: 11px; border-top: 1px solid #394145; }
      output { font-variant-numeric: tabular-nums; }
      #status { color: #f3bf88; }
      @media(max-width: 760px) { header { padding: 10px 12px; gap: 10px 16px; } h1 { flex-basis: 100%; } footer { padding: 8px 12px; flex-wrap: wrap; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Rel&aacute;mpagos</h1>
      <fieldset aria-label="Forma">
        <button type="button" data-mode="mixed" title="Conjunto" aria-label="Conjunto" aria-pressed="true"></button>
        <button type="button" data-mode="line" title="Linea" aria-label="Linea" aria-pressed="false"></button>
        <button type="button" data-mode="cone" title="Cono" aria-label="Cono" aria-pressed="false"></button>
        <button type="button" data-mode="circle" title="Descarga radial" aria-label="Descarga radial" aria-pressed="false"></button>
        <button type="button" data-mode="many" title="24 descargas" aria-label="24 descargas" aria-pressed="false"></button>
      </fieldset>
      <label>Intensidad <input id="intensity" aria-label="Intensidad" type="range" min="0.4" max="2" step="0.05" value="1.2" /></label>
      <label>Velocidad <input id="speed" aria-label="Velocidad" type="range" min="0.2" max="1.5" step="0.05" value="0.7" /></label>
      <label>Zoom <input id="zoom" aria-label="Zoom" type="range" min="0.5" max="2" step="0.05" value="1" /></label>
      <label><input id="sparks" type="checkbox" checked /> Chispas</label>
      <label><input id="floor" type="checkbox" checked /> Mapa</label>
      <button type="button" id="pause" title="Pausar" aria-label="Pausar" aria-pressed="false"></button>
      <button type="button" id="reseed" title="Otra variacion" aria-label="Otra variacion"></button>
    </header>
    <main id="viewport" aria-label="Prueba de relampagos sobre mapa"></main>
    <footer><span>TTRPG Effects <span id="status"></span></span><output id="fps" aria-label="Rendimiento">-- fps</output></footer>
    <script type="module" src="./src/lightning-lab.ts"></script>
  </body>
</html>
